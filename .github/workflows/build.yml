name: Build

# Every push and PR builds slsklog.so to check it compiles.
# Pushing a tag like v1.0.0 also attests the build and publishes a GitHub release.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: write      # create the release
      id-token: write      # sign the build attestation
      attestations: write  # store the build attestation
    steps:
      - uses: actions/checkout@v4

      # Same command as the README, so anyone can reproduce the release build.
      - name: Build
        run: >
          docker run --rm -v "$PWD":/src -w /src gcc:12
          gcc -shared -fPIC -O2 -Wall -o slsklog.so slsklog.c -ldl -lpthread

      - name: Checksum
        run: sha256sum slsklog.so | tee slsklog.so.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: slsklog
          path: |
            slsklog.so
            slsklog.so.sha256

      - name: Attest build provenance
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: slsklog.so

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME" slsklog.so slsklog.so.sha256
          --title "$GITHUB_REF_NAME" --generate-notes
